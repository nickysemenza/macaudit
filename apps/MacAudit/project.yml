# xcodegen spec — `xcodegen generate --spec apps/MacAudit/project.yml`
# produces MacAudit.xcodeproj (gitignored). Run scripts/build-ffi.sh first:
# the app links MacAuditKit, which needs the generated bindings + xcframework.
name: MacAudit
options:
  bundleIdPrefix: dev.nickysemenza
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
packages:
  MacAuditKit:
    path: ../../swift/MacAuditKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # No App Sandbox: the engine scans ~, runs brew/docker/xcrun and trashes
    # files. Hardened runtime is on for every build so the release build is
    # exactly what runs locally; the notary service requires it, and Debug
    # still debugs because Xcode injects get-task-allow there.
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: YES
    # Keep MARKETING_VERSION equal to `version` in the root Cargo.toml (the
    # source of truth, and what `macaudit --version` prints): release.yml
    # asserts the tag matches Cargo.toml and passes both settings on the
    # xcodebuild command line, CURRENT_PROJECT_VERSION being the run number.
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "1"
    # Sign with a real development certificate, not ad-hoc: TCC keys its
    # folder-access grants (Downloads, Desktop, ...) on the signing identity,
    # and an ad-hoc signature is just the binary's hash, so every rebuild
    # re-prompted. CI passes CODE_SIGNING_ALLOWED=NO; on a machine without
    # this team's certificate, override DEVELOPMENT_TEAM or use
    # CODE_SIGN_IDENTITY="-" on the xcodebuild command line.
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: Y9A97FXT63
targets:
  MacAudit:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - package: MacAuditKit
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: MacAudit
        CFBundleDisplayName: MacAudit
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "MIT"
        NSDesktopFolderUsageDescription: "MacAudit sizes build artifacts and caches under your home folder."
        NSDocumentsFolderUsageDescription: "MacAudit sizes build artifacts and caches under your home folder."
        NSDownloadsFolderUsageDescription: "MacAudit sizes build artifacts and caches under your home folder."
        NSRemovableVolumesUsageDescription: "MacAudit only reads sizes; nothing is changed without confirmation."
        NSNetworkVolumesUsageDescription: "MacAudit only reads sizes; nothing is changed without confirmation."
    entitlements:
      path: Resources/MacAudit.entitlements
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.nickysemenza.macaudit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        OTHER_LDFLAGS: ["-liconv", "-lobjc"]
schemes:
  MacAudit:
    build:
      targets:
        MacAudit: all
    run:
      config: Debug
      environmentVariables:
        - variable: MACAUDIT_FAKE
          value: "1"
          isEnabled: false
