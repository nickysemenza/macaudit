[package]
name = "macaudit"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
description = "A 'why is my Mac like this' audit TUI"
license = "MIT"
repository = "https://github.com/nickysemenza/macaudit"

[lib]
name = "macaudit"
path = "src/lib.rs"

[[bin]]
name = "macaudit"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "process", "sync", "time", "signal"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
ratatui = "0.30.2"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio-stream = "0.1"
ignore = "0.4.30"
rayon = "1.12"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
plist = "1.10"
trash = "5.2.6"
clap = { version = "4.6.2", features = ["derive"] }
anyhow = "1.0.103"
humansize = "2.1.3"
unicode-width = "0.2"
toml = "1.1.3"
rusqlite = { version = "0.37", features = ["bundled"] }
async-trait = "0.1.89"
crossbeam-channel = "0.5"

reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip", "http2"] }
regex = "1.13.1"
which = "8.0.6"
node-semver = "2.2.0"
semver = "1.0.28"

[dev-dependencies]
insta = "1"
tempfile = "3.27"

[profile.release]
lto = "thin"
strip = true
