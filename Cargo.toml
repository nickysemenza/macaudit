[workspace]
members = ["crates/macaudit-ffi", "crates/uniffi-bindgen"]

[package]
name = "macaudit"
# Floor only — build.rs raises this to the nearest git tag (or to
# MACAUDIT_VERSION, which scripts/package.sh sets from the release tag), so
# `macaudit --version` follows the tag and this line never needs bumping.
version = "0.0.0"
edition = "2021"
rust-version = "1.93"
description = "A 'why is my Mac like this' audit TUI"
license = "MIT"
repository = "https://github.com/nickysemenza/macaudit"

[lib]
name = "macaudit"
path = "src/lib.rs"

[[bin]]
name = "macaudit"
path = "src/main.rs"
required-features = ["tui"]

[features]
default = ["tui"]
# The ratatui front-end. Off for `macaudit-ffi`, which links the engine into
# a static library for the SwiftUI app and has no terminal to draw on.
tui = ["dep:ratatui", "dep:crossterm", "dep:tokio-stream", "dep:unicode-width"]

[dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "process", "sync", "time", "signal"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
ratatui = { version = "0.30.2", optional = true }
crossterm = { version = "0.29", features = ["event-stream"], optional = true }
tokio-stream = { version = "0.1", optional = true }
ignore = "0.4.30"
rayon = "1.12"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
plist = "1.10"
trash = "5.2.6"
clap = { version = "4.6.2", features = ["derive"] }
anyhow = "1.0.103"
humansize = "2.1.3"
unicode-width = { version = "0.2", optional = true }
toml = "1.1.3"
rusqlite = { version = "0.37", features = ["bundled"] }
async-trait = "0.1.89"
crossbeam-channel = "0.5"

reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip", "http2"] }
regex = "1.13.1"
which = "8.0.6"
node-semver = "2.2.0"
semver = "1.0.28"

[dev-dependencies]
insta = "1"
tempfile = "3.27"

[profile.release]
lto = "thin"
strip = true
