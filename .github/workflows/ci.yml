name: ci
on:
  push: { branches: [main, nicky/scan-to-screen] }
  pull_request:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.93
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo devtools check-dependencies
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test --no-default-features --lib --locked
  app:
    # The SwiftUI app: engine static library → UniFFI bindings → Swift
    # package tests → xcodebuild. Repeat FFI validation with the native
    # application toolchain before generating matching bindings.
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.93
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: brew install xcodegen
      - run: cargo fmt --check -p macaudit-ffi -p uniffi-bindgen
      - run: cargo clippy -p macaudit-ffi --all-targets -- -D warnings
      - run: cargo test -p macaudit-ffi
      - run: scripts/build-ffi.sh --debug
      - run: swift test --package-path swift/MacAuditKit --force-resolved-versions
      - run: xcodegen generate --spec apps/MacAudit/project.yml
      - run: >-
          xcodebuild -project apps/MacAudit/MacAudit.xcodeproj -scheme MacAudit
          -configuration Debug -destination 'platform=macOS'
          -derivedDataPath build/DerivedData -onlyUsePackageVersionsFromResolvedFile
          -skipMacroValidation ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build
      - run: >-
          xcodebuild -project apps/MacAudit/MacAudit.xcodeproj -scheme MacAudit
          -configuration Debug -destination 'platform=macOS'
          -derivedDataPath build/DerivedData -onlyUsePackageVersionsFromResolvedFile
          -skipMacroValidation ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO test
      - run: >-
          xcodebuild -project apps/MacAudit/MacAudit.xcodeproj -scheme MacAudit
          -configuration Release -destination 'platform=macOS'
          -derivedDataPath build/DerivedData -onlyUsePackageVersionsFromResolvedFile
          -skipMacroValidation ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build
